<rect x="48" y="116" width="674" height="596" rx="24" fill="#1d222d" stroke="#303747"/><text x="78" y="160" fill="#8f99ac" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ANALYZE A MESSAGE</text><text x="78" y="199" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Inspect before you click.</text>
