<text x="78" y="354" fill="#adb6c8" font-family="Arial,sans-serif" font-size="14">EMAIL CONTENT</text><rect x="78" y="370" width="614" height="154" rx="13" fill="#141821" stroke="#394153"/><text x="98" y="407" fill="#d6dcea" font-family="Arial,sans-serif" font-size="15">URGENT: Your account will be suspended.</text><text x="98" y="436" fill="#d6dcea" font-family="Arial,sans-serif" font-size="15">Verify your password immediately using the link.</text>
<rect x="78" y="552" width="614" height="56" rx="28" fill="url(#a)"/><text x="320" y="587" fill="#0f1320" font-family="Arial,sans-serif" font-size="17" font-weight="700">Analyze risk</text><text x="78" y="650" fill="#70798c" font-family="Arial,sans-serif" font-size="12">The demo never opens or fetches submitted URLs.</text>
