<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Sentinel phishing risk dashboard</title><desc id="d">Dark interface with URL and email analysis, a risk score, signals, and recommended actions.</desc>
